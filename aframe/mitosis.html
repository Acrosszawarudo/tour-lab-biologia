<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Práctica de Biología</title>

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<script>

window.addEventListener('load', () => {

    const cromosoma =
        document.querySelector('#cromosoma1');

    cromosoma.addEventListener('click', () => {

        cromosoma.setAttribute(
            'scale',
            '1.3 1.3 1.3'
        );

    });

});

const boton =
    document.getElementById("botonPrueba");

boton.addEventListener("click", () => {

    console.log("¡Botón presionado!");

    boton.setAttribute(
        "color",
        "#EF4444"
    );

});

</script>
    
<body>

    <a-scene>

        <!-- Suelo -->
        <a-plane
            position="0 0 0"
            rotation="-90 0 0"
            width="10"
            height="10"
            color="#222222">
        </a-plane>

        <!-- Cámara -->
        <a-camera
            position="0 1.6 4">
        </a-camera>

        <!-- Célula -->
        <a-sphere
            position="0 1.5 -2"
            radius="1.5"
            color="#8fd3ff"
            opacity="0.5">
        </a-sphere>

        <!-- Núcleo -->
        <a-sphere
            position="0 1.5 -2"
            radius="0.6"
            color="#9b59b6">
        </a-sphere>

        <!-- Cromosoma 1 -->
        <a-entity id="cromosoma1" position="-0.2 1.5 -2">

            <a-box
                position="-0.1 0 0"
                width="0.12"
                height="0.5"
                depth="0.12"
                rotation="0 0 -15"
                color="#e74c3c">
            </a-box>

            <a-box
                position="0.1 0 0"
                width="0.12"
                height="0.5"
                depth="0.12"
                rotation="0 0 15"
                color="#e74c3c">
            </a-box>

        </a-entity>

        <!-- Cromosoma 2 -->
        <a-entity position="0.2 1.5 -2">

            <a-box
                position="-0.1 0 0"
                width="0.12"
                height="0.5"
                depth="0.12"
                rotation="0 0 -15"
                color="#e74c3c">
            </a-box>

            <a-box
                position="0.1 0 0"
                width="0.12"
                height="0.5"
                depth="0.12"
                rotation="0 0 15"
                color="#e74c3c">
            </a-box>

        </a-entity>

        <a-box
            id="botonPrueba"
            class="clickable"
            position="0 1.5 -3"
            width="1.8"
            height="0.7"
            depth="0.3"
            color="#22C55E">

            <a-text
                value="PROBAR CONTROL"
                align="center"
                position="0 0 0.16"
                width="3"
                color="#FFFFFF">
            </a-text>

        </a-box>

        <a-camera position="0 1.6 0">

            <a-cursor
                raycaster="objects: .clickable"
                fuse="false"
                color="#FFFFFF">
            </a-cursor>

        </a-camera>

        <!-- CONTROL IZQUIERDO -->
        <a-entity
            id="leftController"
            meta-touch-controls="hand: left"
            laser-controls="hand: left"
            raycaster="objects: .clickable; far: 10"
            line="color: #00FF00; opacity: 0.8">
        </a-entity>


        <!-- CONTROL DERECHO -->
        <a-entity
            id="rightController"
            meta-touch-controls="hand: right"
            laser-controls="hand: right"
            raycaster="objects: .clickable; far: 10"
            line="color: #00FF00; opacity: 0.8">
        </a-entity>

    </a-scene>

</body>
</html>
